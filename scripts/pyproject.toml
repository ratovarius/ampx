[project]
name = "ampx-test-fixtures"
version = "0.1.0"
description = "Generate binary test fixtures for AmpX"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.65.0",
    "pillow>=12.3.0",
]

[project.scripts]
generate-fixtures = "ampx_fixtures.generate:main"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
# Matches the 140-col Swift budget loosely; 120 keeps generate.py signatures on one line.
line-length = 120
# The ad-hoc measurement/comparison scripts are throwaway analysis tools, not
# shipped code. Only the packaged fixture generator is gated.
include = ["ampx_fixtures/**/*.py", "pyproject.toml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ampx_fixtures"]
